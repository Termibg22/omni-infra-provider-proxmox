name: Build and Publish Container Image

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Unit tests and race detector
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build supported architectures
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/provider-amd64 ./cmd/omni-infra-provider-proxmox
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/provider-arm64 ./cmd/omni-infra-provider-proxmox

  build-and-push:
    needs: verify
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags
        id: meta
        run: |
          IMAGE_REPO="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/omni-infra-provider-proxmox"
          SHA_SHORT=$(git rev-parse --short HEAD)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
            TAGS="-t ${IMAGE_REPO}:${VERSION_TAG}"
            if [[ "${VERSION_TAG}" != *-* ]]; then
              TAGS="${TAGS} -t ${IMAGE_REPO}:latest"
            fi
          else
            VERSION_TAG="main-${SHA_SHORT}"
            TAGS="-t ${IMAGE_REPO}:${VERSION_TAG} -t ${IMAGE_REPO}:edge"
          fi
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch container image (linux/amd64, linux/arm64)
        run: |
          docker buildx build \
            --file=Dockerfile \
            --provenance=false \
            --sbom=false \
            --platform=linux/amd64,linux/arm64 \
            --target=image-omni-infra-provider-proxmox \
            --build-arg=TOOLCHAIN=docker.io/golang:1.27.3-alpine \
            --build-arg=CGO_ENABLED=0 \
            --build-arg="GO_BUILDFLAGS=-tags ," \
            --build-arg=GOTOOLCHAIN=local \
            --build-arg=PROTOBUF_GO_VERSION=1.36.12 \
            --build-arg=GRPC_GO_VERSION=1.6.2 \
            --build-arg=GRPC_GATEWAY_VERSION=2.30.0 \
            --build-arg=VTPROTOBUF_VERSION=0.6.0 \
            --build-arg=GOIMPORTS_VERSION=0.50.0 \
            --build-arg=GOMOCK_VERSION=0.6.0 \
            --build-arg=DEEPCOPY_VERSION=v0.5.8 \
            --build-arg=GOLANGCILINT_VERSION=v2.14.0 \
            --build-arg=GOFUMPT_VERSION=v0.12.0 \
            --build-arg=DIS_VULNCHECK_VERSION=v0.0.0-20260708185140-0c30eb543ad8 \
            --build-arg=TAG="${{ steps.meta.outputs.version_tag }}" \
            --build-arg=ABBREV_TAG="${{ steps.meta.outputs.version_tag }}" \
            --build-arg=SHA="${{ steps.meta.outputs.sha_short }}" \
            --push \
            ${{ steps.meta.outputs.tags }} \
            .
